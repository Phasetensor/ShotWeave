[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "shotweave"
version = "0.1.0.dev0"
description = "Integer shot allocation for quantum measurement experiments"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}

[tool.setuptools]
packages = ["shotweave"]
