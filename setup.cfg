[metadata]
name = shotweave
version = file: VERSION
description = Integer shot allocation for independent quantum measurement experiments
long_description = file: README.md
long_description_content_type = text/markdown
license = Apache-2.0
license_files = LICENSE
url = https://github.com/Phasetensor/ShotWeave
author = PhaseTensor

[options]
packages = shotweave
python_requires = >=3.9

[options.entry_points]
console_scripts =
    shotweave = shotweave.__main__:main

[options.extras_require]
qiskit =
    qiskit>=2,<3
