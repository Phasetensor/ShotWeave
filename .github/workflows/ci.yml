name: Test and package
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python: ["3.9", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest -v
      - run: python -m pip install build
      - run: python -m build
      - run: python -m pip install dist/*.whl
      - run: cd /tmp && shotweave --help
      - run: python benchmark.py
  qiskit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install '.[qiskit]'
      - run: python qiskit_example.py
      - run: python -m unittest -v
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install '.[qiskit]' coverage ruff mypy
      - run: ruff check shotweave
      - run: ruff format --check shotweave
      - run: mypy --follow-imports=silent --disallow-untyped-defs shotweave
      - run: coverage run --branch --source=shotweave -m unittest discover
      - run: coverage report -m | tee -a "$GITHUB_STEP_SUMMARY"
      - run: coverage json && python scripts/coverage_gate.py
