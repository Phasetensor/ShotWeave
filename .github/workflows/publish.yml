name: Publish ShotWeave to PyPI
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [VERSION]
permissions:
  contents: read
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build twine '.[qiskit]'
      - run: python -m unittest -v
      - run: python qiskit_example.py
      - run: python -m build && python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
  verify:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          for attempt in {1..10}; do
            python -m pip install --index-url https://pypi.org/simple --no-cache-dir "shotweave==$(cat VERSION)" && break
            sleep 10
          done
          cd /tmp
          shotweave --help
