name: Publish ShotWeave to PyPI
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [VERSION]
permissions:
  contents: read
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build twine ruff coverage mypy '.[qiskit]'
      - run: ruff check shotweave && ruff format --check shotweave
      - run: mypy --follow-imports=silent --disallow-untyped-defs shotweave
      - run: coverage run --branch --source=shotweave -m unittest discover && coverage json && python scripts/coverage_gate.py
      - run: python qiskit_example.py
      - run: python -m build && python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
  verify:
    needs: publish
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          for attempt in {1..10}; do
            python -m pip install --index-url https://pypi.org/simple --no-cache-dir "shotweave==$(cat VERSION)" && break
            sleep 10
          done
          cd /tmp
          shotweave --help
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - run: python scripts/verify_distribution.py
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$(cat VERSION)" dist/* --target "$GITHUB_SHA" --title "ShotWeave $(cat VERSION)" --notes-file CHANGELOG.md
