name: Publish GitHub release v0.1.0
on:
  push:
    branches: [main]
    paths: [releases/v0.1.0.md]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish verified PyPI revision
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: 6c7297ae15ce7f55e8381419b6a4b618b3f65a05
        run: |
          gh release create v0.1.0 --target "$TARGET" --title "ShotWeave 0.1.0" --notes-file releases/v0.1.0.md
