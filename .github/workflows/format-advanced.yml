name: Format advanced branch
on:
  push:
    branches: [advanced-resource-optimization]
    paths: ['.github/workflows/format-advanced.yml']
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ruff
      - run: |
          ruff format shotweave
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add shotweave
          git diff --cached --quiet || git commit -m 'Apply Ruff formatting to public library'
          git push
